global:
  kubeconfig: "$HOME/.config/kontext/kubeconfig.yaml"

state:
  file: $HOME/.local/state/kontext/state.json

groups:
  items:
    - name: default
      context:
        default: kind-local
        selection:
          default: kind-local
          sort: desc
      sources:
        - default
    - name: dev
      sources:
        - dev
  selection:
    default: dev
    sort: asc


sources:
  items:
    - name: default
      include:
        - $HOME/.config/kontext/**/*.yaml
      exclude:
        - $HOME/.config/kontext/**/*prod*.yaml

    - name: dev
      include:
        - $HOME/.config/kontext/dev/**/*.yaml
      exclude:
        - $HOME/.config/kontext/dev/**/*prod*.yaml
